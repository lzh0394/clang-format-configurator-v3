name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The schema is committed; only the wasm binaries need downloading.
      - uses: actions/cache@v6
        with:
          path: public/wasm
          key: wasm-${{ hashFiles('tools/versions.json') }}
          restore-keys: wasm-

      # See ci.yml: a cached Playwright Chromium and no apt step keep this job
      # deterministic (~1 min) instead of occasionally stalling for minutes.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: npm ci
      - run: npm run prepare:wasm
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # The only test that sees the real deployment: base path, asset URLs,
  # worker and schema fetches all have to work on the live origin.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: npm ci
      - run: npx playwright install chromium

      - name: Wait for the deployment to serve
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PAGE_URL")
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "deployment did not return 200: $code"
          exit 1

      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
          PW_BASE_URL: ${{ needs.deploy.outputs.page_url }}
