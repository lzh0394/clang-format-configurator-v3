name: ci

on:
  push:
    branches: [main]
  pull_request:

# Rapid pushes supersede earlier runs instead of stacking full suites behind
# each other (duplicate concurrent runs were part of the 10 minute tail).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Exercise the deployed sub-path on every run: that is where asset and
      # worker URLs break if BASE_URL is not threaded through.
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Golden fixtures (tests/golden/*.json) are native clang-format 21.1.8
      # output (plan §1, §8); the PyPI wheel ships the native binary. The
      # browser e2e suite runs the same fixtures through wasm and compares
      # byte-for-byte, so the committed JSON must never drift from native.
      # setup-python keeps `python` on PATH and avoids the runner's
      # externally-managed system Python (PEP 668); adds only a few seconds.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native clang-format 21.1.8
        run: python -m pip install --disable-pip-version-check clang-format==21.1.8

      - name: Check golden fixtures against native clang-format
        run: node tools/gen-golden.mjs --check

      # The schema is committed; only the wasm binaries need downloading.
      - uses: actions/cache@v6
        with:
          path: public/wasm
          key: wasm-${{ hashFiles('tools/versions.json') }}
          restore-keys: wasm-

      # Playwright's pinned Chromium only changes when the lockfile changes.
      # Caching it turns the install step into a ~1 s no-op, which also removes
      # the apt/network stall that occasionally pushed this job to ~10 minutes.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: npm ci
      - run: npm run prepare:wasm
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # plan §1 gzip budgets: initial JS + per-version wasm/schema. Fails fast
      # here instead of letting an over-budget artifact be published.
      - run: npm run check:size

      # No --with-deps: ubuntu-latest ships Chrome and every shared library
      # Chromium needs, and running apt-get on every build was the only slow,
      # flaky part of this workflow. If a future image drops a dependency,
      # e2e fails fast with Playwright's install-deps hint.
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
